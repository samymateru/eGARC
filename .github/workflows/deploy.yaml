name: deloply frontend service
#  This workflow deploys the frontend service to a remote server using SSH.
on: [push]
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: executing remote ssh commands using password
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: "eauditrisk.com"
          username: "ubuntu"
          key: ${{ secrets.KEY }}
          script: |
            cd project/eGARC
            git pull
            docker build -t frontend .
            docker builder prune -f  
            cd ..
            cd Samwel
            sudo docker compose down
            sudo docker compose up -d